<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — Constella</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  
  <!-- باش تخدم الأيقونة ديال جوجل -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/login.css" />
</head>
<body class="login-body">

  <!-- خلفية Constella المتحركة (chromatography bubbles) -->
  <script type="module">
    import { initChromaBackground } from "../js/chromaBackground.js";
    initChromaBackground({ opacity: 0.6 });
  </script>

  <main class="login-wrapper">
    <div class="panel login-panel">
      
      <div class="brand login-brand">
        <span class="brand-mark">⌗</span>
        <div>
          <h1>Constella</h1>
          <p class="subtitle">Graphe de concepts — extraction assistée</p>
        </div>
      </div>

      <div class="login-actions">
        <!-- هادي هي البوطونة اللي غتكليكي عليها باش تطلع الـ popup -->
        <button id="googleLoginBtn" class="google-btn">
          <i class="fa-brands fa-google"></i>
          Continuer avec Google
        </button>
      </div>

      <p class="login-terms">
        En continuant, vous acceptez nos <a href="#">Conditions</a> et notre <a href="#">Politique de confidentialité</a>.
      </p>

    </div>
  </main>

  <script>
    // هاد الكود هو اللي كيربط الديزاين باللوجيك ديالك
    document.getElementById('googleLoginBtn').addEventListener('click', () => {
        // ملي المستخدم كيكليكي، كنفتحو start-auth.html فـ Popup ديال المتصفح
        // العرض 500 والطول 600 باش تبان بحال ديال جوجل نيشان
        window.open(
            'start-auth.html', 
            'GoogleLogin', 
            'width=500,height=600,left=400,top=100'
        );
    });
  </script>

</body>
</html>

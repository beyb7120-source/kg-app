<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tableau de bord — Constella</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
  
  <!-- كنستعملو نفس الستايل الأصلي باش نحافظو على الألوان -->
  <!-- ملحوظة: صححنا هنا المسار — dashboard.html كاين فالروت ديال المشروع
       (حدا index.html)، ماشي وسط مجلد فرعي، فخاص المسار يكون "css/..."
       ماشي "../css/..." (اللي كان غيدير 404 على الديبلوي). -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

<!-- خلفية Constella المتحركة (chromatography bubbles) -->
<script type="module">
  import { initChromaBackground } from "./js/chromaBackground.js";
  initChromaBackground({ opacity: 0.35 });
</script>

  <!-- النافذة العلوية (Header) خفيفة -->
  <header class="dashboard-header">
    <div class="brand">
      <span class="brand-mark">⌗</span>
      <h1>Constella</h1>
    </div>
    <div class="user-profile">
      <span id="userName">Chargement...</span>
      <button id="themeToggleBtn" class="icon-btn" title="Changer de thème" aria-label="Changer entre thème sombre et clair">
        <i class="fa-solid fa-sun"></i>
      </button>
      <button id="logoutBtn" class="logout-btn">Déconnexion</button>
    </div>
  </header>

  <main class="dashboard-main">
    <h2 class="section-title">Recent graphs</h2>

    <div class="dashboard-toolbar">
      <input type="search" id="searchInput" class="search-input" placeholder="Rechercher un graphe..." aria-label="Rechercher un graphe par titre" />
    </div>

    <div class="graphs-grid" id="graphsGrid">
      
      <!-- الكارد ديال إنشاء مبيان جديد (دائما كاينة) -->
      <div class="graph-card create-card" id="createNewGraphBtn">
        <div class="create-icon">+</div>
        <p>Create new graph</p>
      </div>

    </div>

    <div class="load-more-wrap" id="loadMoreWrap" style="display:none">
      <button id="loadMoreBtn" class="load-more-btn">Charger plus</button>
    </div>
  </main>

  <script type="module" src="js/dashboard.js"></script>

  <div class="toast-container" id="toastContainer" aria-live="polite"></div>
</body>
</html>
